name: Deploy

on:
  push:
    branches:
      - source

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.0.2'
    - name: Enable bundler cache
      uses: actions/cache@v4
      with:
        path: vendor/bundle
        key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-gems-
    - name: Install deps
      run: |
        gem install bundler
        bundle config path vendor/bundle
        bundle install --jobs 4 --retry 3
        npm install -g mermaid.cli
    - name: Deploy website
      run: |
        set -euo pipefail
        git config user.name "GitHub Action"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        bundle exec jekyll build
        git show origin/master:CNAME > /tmp/CNAME 2>/dev/null || true
        git checkout --orphan pages
        git rm -rf .
        find _site -mindepth 1 -maxdepth 1 -exec mv -t . -- {} +
        if [ -s /tmp/CNAME ]; then mv /tmp/CNAME CNAME; fi
        git add -fA
        git commit --allow-empty -m "Deploy ${GITHUB_SHA} [skip ci]"
        git push --force origin HEAD:master
